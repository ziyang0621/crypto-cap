<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoInsight Template</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <!-- iOS Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <span>9:41</span>
      </div>
      <div class="status-right">
        <span class="status-icon"><i class="fas fa-signal"></i></span>
        <span class="status-icon"><i class="fas fa-wifi"></i></span>
        <span class="status-icon"><i class="fas fa-battery-full"></i></span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Your page content goes here -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="navigation-bar">
      <a href="home.html" class="nav-item active">
        <div class="nav-icon"><i class="fas fa-home"></i></div>
        <div>Home</div>
      </a>
      <a href="search.html" class="nav-item">
        <div class="nav-icon"><i class="fas fa-search"></i></div>
        <div>Search</div>
      </a>
      <a href="watchlist.html" class="nav-item">
        <div class="nav-icon"><i class="fas fa-star"></i></div>
        <div>Watchlist</div>
      </a>
      <a href="news.html" class="nav-item">
        <div class="nav-icon"><i class="fas fa-newspaper"></i></div>
        <div>News</div>
      </a>
      <a href="profile.html" class="nav-item">
        <div class="nav-icon"><i class="fas fa-user"></i></div>
        <div>Profile</div>
      </a>
    </div>

    <script>
      // Helper script to highlight the active nav item
      document.addEventListener('DOMContentLoaded', function () {
        const currentPage = window.location.pathname.split('/').pop();
        document.querySelectorAll('.nav-item').forEach((item) => {
          if (item.getAttribute('href') === currentPage) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
      });
    </script>
  </body>
</html>
